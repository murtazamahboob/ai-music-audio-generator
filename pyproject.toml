[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-audio-generator"
version = "1.0.0"
description = "Turn text into original music: mood-aware text-to-melody, offline WAV synthesis and waveform/piano-roll visualisation, all in pure stdlib Python."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Murtaza Mahboob" }]
keywords = [
    "music-generation",
    "text-to-music",
    "audio-synthesis",
    "wav",
    "music-visualization",
    "piano-roll",
    "generative-music",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
musicgen = "musicgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
